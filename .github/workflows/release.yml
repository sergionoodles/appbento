name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require update signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoVersion = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if ([packageVersion, tauriVersion, cargoVersion].some(version => `v${version}` !== process.env.RELEASE_TAG)) {
            throw new Error('The release tag and all three app versions must match.');
          }
          JS
      - name: Check frontend
        run: pnpm check
      - name: Test backend
        run: cargo test --locked --workspace
      - name: Generate release notes from commits
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git rev-parse --verify "$RELEASE_TAG^{commit}" > /dev/null
          if previous_tag=$(git describe --tags --match 'v*' --exclude="$RELEASE_TAG" --abbrev=0 "$RELEASE_TAG" 2>/dev/null); then
            commit_range="$previous_tag..$RELEASE_TAG"
          else
            commit_range="$RELEASE_TAG"
          fi

          delimiter="release_notes_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "body<<$delimiter"
            echo '## Changes'
            echo
            git log --reverse --format='- %s (`%h`)' "$commit_range"
            echo
            echo 'Download the x86_64 AppImage below, make it executable, and launch it.'
            echo 'Future AppBento updates are available from the Settings menu.'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Build signed AppImage and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AppBento ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          args: --bundles appimage
