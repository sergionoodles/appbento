match_filenames = ["Bitwarden-*.AppImage"]
match_binaries = ["bitwarden"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "bitwarden"
name = "Bitwarden"
summary = "Open-source password manager"
description = "Bitwarden desktop app for secure password management."
website = "https://bitwarden.com"
docs_url = "https://bitwarden.com/help/"
repo = "https://github.com/bitwarden/clients"
license = "GPL-3.0"
categories = ["Security", "Utilities"]
verified = true

[branding]
logo = "https://bitwarden.com/favicon.ico"
cover = "https://bitwarden.com/images/hero.png"
screenshots = []
accent = "#175ddc"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^desktop-[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "bitwarden/clients"
asset_regex = "Bitwarden-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Utility;"
terminal = false

