match_filenames = ["Obsidian-*.AppImage"]
match_binaries = ["obsidian"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "obsidian"
name = "Obsidian"
summary = "Private and flexible note-taking app"
description = "Obsidian is a powerful knowledge base on top of local Markdown files."
website = "https://obsidian.md"
docs_url = "https://help.obsidian.md"
repo = "https://github.com/obsidianmd/obsidian-releases"
license = "Proprietary"
categories = ["Productivity", "Notes"]
verified = true

[branding]
logo = "https://obsidian.md/favicon.svg"
cover = "https://obsidian.md/images/hero.png"
screenshots = []
accent = "#7c3aed"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "obsidianmd/obsidian-releases"
asset_regex = "Obsidian-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Office;"
terminal = false

[sandbox]
network = false
display = true
audio = false
gpu = false
persistent_data = true
paths = []
