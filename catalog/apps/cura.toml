match_filenames = ["UltiMaker-Cura-*.AppImage", "Cura-*.AppImage"]
match_binaries = ["cura"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "cura"
name = "Ultimaker Cura"
summary = "3D printer slicing software"
description = "Cura prepares 3D models for printing with hundreds of settings."
website = "https://ultimaker.com/software/ultimaker-cura"
repo = "https://github.com/Ultimaker/Cura"
license = "LGPL-3.0"
categories = ["Engineering", "3D Printing"]
verified = false

[branding]
logo = "https://ultimaker.com/favicon.ico"
cover = "https://ultimaker.com/images/cura-hero.png"
screenshots = []
accent = "#1b7fbd"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "Ultimaker/Cura"
asset_regex = ".*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Graphics;"
terminal = false

[sandbox]
network = false
display = true
audio = false
gpu = false
persistent_data = true
paths = []
