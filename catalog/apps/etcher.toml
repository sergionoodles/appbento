match_filenames = ["balenaEtcher-*.AppImage", "balena-etcher*.AppImage"]
match_binaries = ["balena-etcher"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "etcher"
name = "balenaEtcher"
summary = "Flash OS images to SD cards and USB drives"
description = "Etcher is a powerful OS image flasher with validation."
website = "https://etcher.balena.io"
repo = "https://github.com/balena-io/etcher"
license = "Apache-2.0"
categories = ["Utilities", "System"]
verified = true

[branding]
logo = "https://etcher.balena.io/favicon.ico"
cover = "https://etcher.balena.io/images/hero.png"
screenshots = []
accent = "#00b39e"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "balena-io/etcher"
asset_regex = "balenaEtcher-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Utility;"
terminal = false

