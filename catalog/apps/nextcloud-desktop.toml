match_filenames = ["Nextcloud-*.AppImage"]
match_binaries = ["nextcloud"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "nextcloud-desktop"
name = "Nextcloud Desktop"
summary = "Sync client for Nextcloud"
description = "Nextcloud Desktop keeps your files in sync across devices."
website = "https://nextcloud.com"
repo = "https://github.com/nextcloud/desktop"
license = "GPL-2.0"
categories = ["Internet", "Cloud"]
verified = true

[branding]
logo = "https://nextcloud.com/favicon.ico"
cover = "https://nextcloud.com/images/hero.png"
screenshots = []
accent = "#0082c9"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "nextcloud/desktop"
asset_regex = "Nextcloud-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Network;"
terminal = false

