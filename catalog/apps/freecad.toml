match_filenames = ["FreeCAD-*.AppImage"]
match_binaries = ["freecad"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "freecad"
name = "FreeCAD"
summary = "Parametric 3D CAD modeler"
description = "FreeCAD is an open-source parametric 3D modeler for CAD, MCAD and FEM."
website = "https://www.freecad.org"
repo = "https://github.com/FreeCAD/FreeCAD"
license = "LGPL-2.1"
categories = ["Graphics", "Engineering"]
verified = true

[branding]
logo = "https://www.freecad.org/images/logo.png"
cover = "https://www.freecad.org/images/hero.png"
screenshots = []
accent = "#c1272d"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "FreeCAD/FreeCAD"
asset_regex = ".*x86_64\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Graphics;"
terminal = false

[sandbox]
network = false
display = true
audio = false
gpu = false
persistent_data = true
paths = []
