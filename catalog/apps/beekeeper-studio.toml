match_filenames = ["Beekeeper-Studio-*.AppImage"]
match_binaries = ["beekeeper-studio"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "beekeeper-studio"
name = "Beekeeper Studio"
summary = "Modern SQL editor and database manager"
description = "Beekeeper Studio is a SQL editor with a clean UI for MySQL, Postgres, SQLite and more."
website = "https://www.beekeeperstudio.io"
repo = "https://github.com/beekeeper-studio/beekeeper-studio"
license = "GPL-3.0"
categories = ["Development", "Database"]
verified = true

[branding]
logo = "https://www.beekeeperstudio.io/favicon.ico"
cover = "https://www.beekeeperstudio.io/images/hero.png"
screenshots = []
accent = "#f5b83d"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "beekeeper-studio/beekeeper-studio"
asset_regex = "Beekeeper-Studio-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Development;"
terminal = false

