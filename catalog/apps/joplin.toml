match_filenames = ["Joplin-*.AppImage", "Joplin*.AppImage"]
match_binaries = ["joplin"]
version_regex = "(?i)(?:^|[-_])v?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-(?:alpha|beta|rc)\\.?[0-9]+)?)(?:[-_.]|$)"

[app]
id = "joplin"
name = "Joplin"
summary = "Open-source note taking and to-do app"
description = "Joplin is a free, open source note taking and to-do application with sync."
website = "https://joplinapp.org"
docs_url = "https://joplinapp.org/help/"
repo = "https://github.com/laurent22/joplin"
license = "AGPL-3.0"
categories = ["Productivity", "Notes"]
verified = true

[branding]
logo = "https://joplinapp.org/images/logo.png"
cover = "https://joplinapp.org/images/hero.png"
screenshots = []
accent = "#1070e0"

[update]
strategy = "github-release"

[update.github]
architecture = "x86_64"
tag_regex = "^[vV]?(?P<version>[0-9]+(?:\\.[0-9]+){1,3}(?:-[A-Za-z0-9.]+)?)(?:\\+[A-Za-z0-9.]+)?$"
repo = "laurent22/joplin"
asset_regex = "Joplin-.*\\.AppImage$"
prerelease = false
channel = "stable"

[desktop]
categories = "Office;"
terminal = false

